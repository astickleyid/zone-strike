<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#080806" />
  <title>Zone Strike</title>
  <style>
    html,body{margin:0;height:100%;background:#080806;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
    #game{width:100vw;height:100vh;display:block;touch-action:none;outline:none}
    #boot-loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e8622a;letter-spacing:6px;font-size:13px;font-weight:bold;z-index:20}
    #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
    #crosshair{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}
    #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.85)}
    #crosshair::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
    #crosshair::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
    #stats{position:absolute;top:14px;left:16px;color:#f2ede4;font-size:13px;letter-spacing:2px;line-height:1.6;text-shadow:0 1px 3px #000}
    #stats b{color:#e8622a}
    #hitmarker{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%) rotate(45deg);opacity:0;transition:opacity .05s}
    #hitmarker::before,#hitmarker::after{content:'';position:absolute;background:#fff}
    #hitmarker::before{left:50%;top:0;width:2px;height:100%;transform:translateX(-50%)}
    #hitmarker::after{top:50%;left:0;height:2px;width:100%;transform:translateY(-50%)}
    #healthbar{position:absolute;left:16px;bottom:18px;display:flex;align-items:center;gap:8px}
    #hp-track{width:160px;height:12px;background:rgba(10,8,6,0.6);border:1px solid rgba(242,237,228,0.3);border-radius:2px;overflow:hidden}
    #hp-fill{height:100%;width:100%;background:#7CFF6B;transition:width .15s,background .2s}
    #hp-num{color:#f2ede4;font:bold 13px monospace;text-shadow:0 1px 2px #000;min-width:28px}
    #dmg-vignette{position:fixed;inset:0;pointer-events:none;z-index:11;opacity:0;transition:opacity .12s;box-shadow:inset 0 0 140px 40px rgba(200,20,10,0.65)}
    #death-overlay{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(40,5,2,0.5);backdrop-filter:blur(2px)}
    #death-text{color:#ff4a3a;font-size:34px;font-weight:bold;letter-spacing:6px;text-shadow:0 2px 8px #000}
    #death-sub{color:#f2ede4;font-size:13px;letter-spacing:3px;margin-top:10px;opacity:0.85}
    .mbtn{position:absolute;pointer-events:all;width:60px;height:60px;border-radius:50%;border:1.5px solid rgba(242,237,228,0.35);background:rgba(20,18,14,0.5);color:#f2ede4;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:1px;font-weight:bold;-webkit-tap-highlight-color:transparent}
    .mbtn:active{background:rgba(232,98,42,0.3);border-color:#e8622a}
    #btn-jump{right:120px;bottom:108px}
    #btn-crouch{right:120px;bottom:38px}
    #btn-fire{right:34px;bottom:54px;width:84px;height:84px;font-size:13px;border-color:rgba(232,98,42,0.6);background:rgba(232,98,42,0.18)}
    #btn-fire:active{background:rgba(232,98,42,0.45)}
    #btn-ads{right:128px;bottom:150px;width:52px;height:52px}
    #btn-sprint{left:24px;bottom:150px;width:52px;height:52px}
    .mbtn.on{background:rgba(120,180,255,0.32);border-color:#7ab8ff;color:#cfe6ff}
    .desktop-hide{}
    @media (hover:hover) and (pointer:fine){ .mbtn{display:none} #hint-d{display:block!important} }
    #hint-d{display:none;position:absolute;bottom:14px;left:16px;color:rgba(242,237,228,0.5);font-size:11px;letter-spacing:1px}
  </style>
</head>
<body>
  <div id="err" style="position:fixed;inset:0;z-index:99;display:none;padding:18px;color:#ff6b4a;background:#0a0805;font:12px/1.5 monospace;white-space:pre-wrap;overflow:auto"></div>
  <script>
    (function(){
      var box=document.getElementById('err');
      function show(msg){ if(!box) return; box.style.display='block'; box.textContent += msg + "\n"; }
      window.__stage=function(s){ var l=document.getElementById('boot-loader'); if(l) l.textContent=s; };
      window.addEventListener('error', function(e){ show('ERROR: '+(e.message||e.error||e)+(e.filename?(' @ '+e.filename+':'+e.lineno):'')); });
      window.addEventListener('unhandledrejection', function(e){ show('PROMISE REJECT: '+(e.reason && (e.reason.stack||e.reason.message||e.reason) || e)); });
    })();
  </script>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="crosshair"></div>
    <div id="hitmarker"></div>
    <div id="stats">KILLS <b id="hud-kills">0</b></div>
    <div id="healthbar"><div id="hp-track"><div id="hp-fill"></div></div><div id="hp-num">100</div></div>
    <button class="mbtn" id="btn-jump">JUMP</button>
    <button class="mbtn" id="btn-crouch">CRCH</button>
    <button class="mbtn" id="btn-fire">FIRE</button>
    <button class="mbtn" id="btn-ads">ADS</button>
    <button class="mbtn" id="btn-sprint">RUN</button>
    <div id="hint-d">CLICK TO LOCK · WASD MOVE · MOUSE LOOK · SPACE JUMP · C CROUCH · SHIFT SPRINT · CLICK FIRE</div>
  </div>
  <div id="dmg-vignette"></div>
  <div id="death-overlay"><div id="death-text">ELIMINATED</div><div id="death-sub">Respawning…</div></div>
  <div id="boot-loader">LOADING…</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
